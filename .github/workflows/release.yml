name: NetPulse 2D - Release Installer on Tag

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versao a publicar (ex: 1.0.0 ou 1.0.0-beta.1)'
        required: true
        default: '1.0.0'

permissions:
  contents: write

jobs:
  release:
    name: Build, Package Installer & Publish Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release version from tag or input
        id: get_version
        shell: pwsh
        run: |
          $ver = "${{ github.event.inputs.version }}"
          if (-not $ver) {
            $ref = "${{ github.ref }}"
            if ($ref -match "refs/tags/v(.+)") {
              $ver = $matches[1]
            } else {
              $ver = "1.0.0"
            }
          }
          $isPrerelease = if ($ver -match "alpha|beta|rc") { "true" } else { "false" }
          $tagName = if ("${{ github.ref }}".StartsWith("refs/tags/")) { "${{ github.ref_name }}" } else { "v$ver" }

          Write-Host "Release version: $ver (tag: $tagName, prerelease: $isPrerelease)"
          echo "version=$ver" >> $env:GITHUB_OUTPUT
          echo "tag_name=$tagName" >> $env:GITHUB_OUTPUT
          echo "is_prerelease=$isPrerelease" >> $env:GITHUB_OUTPUT

      - name: Setup MSVC x64 toolchain
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Inno Setup 6
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Verify frontend JS syntax
        run: |
          node --check static/topo.js
          node --check static/map-canvas.js
          node --check static/app.js

      - name: Build, test and generate Windows installer + portable ZIP
        shell: pwsh
        run: .\packaging\build-installer.ps1 -Version "${{ steps.get_version.outputs.version }}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.tag_name }}
          name: NetPulse 2D v${{ steps.get_version.outputs.version }}
          draft: false
          prerelease: ${{ steps.get_version.outputs.is_prerelease == 'true' }}
          generate_release_notes: true
          files: |
            dist/NetPulse2D-Setup-x64.exe
            dist/NetPulse2D-Portable-x64.zip
            dist/checksums.txt
          body: |
            ## 🌐 NetPulse 2D v${{ steps.get_version.outputs.version }}

            Mapa planetario 2D em tempo real de conexoes de rede com motor nativo **C++20 (`/O2`)**.

            ### 📦 Artefatos desta Release
            - **Instalador Windows (x64)**: `NetPulse2D-Setup-x64.exe` (instalacao por usuario sem exigir admin ou para todos os usuarios).
            - **Pacote Portatil (x64)**: `NetPulse2D-Portable-x64.zip` (extraia e execute `netpulse.exe`).
            - **Checksums SHA-256**: `checksums.txt`.
